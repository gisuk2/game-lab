<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>game-lab</title>
    <style>
      :root { color-scheme: dark; }
      body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 0%, #2a2040, #120d14 70%); color: #f2e6cf;
        font-family: 'Galmuri11', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; word-break: keep-all; }
      main { max-width: 880px; margin: 0 auto; padding: 48px 24px; }
      h1 { margin: 0 0 4px; font-size: 32px; letter-spacing: 2px; color: #f2d98a; }
      .sub { margin: 0 0 32px; color: #b8a888; }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
      .card { display: flex; flex-direction: column; gap: 8px; padding: 18px; background: #1e1418; border: 2px solid #4a3a2a; text-decoration: none; color: inherit;
        box-shadow: 0 4px 0 #0008; transition: transform .12s, border-color .12s; }
      a.card:hover { transform: translateY(-3px); border-color: #c9a23a; }
      .card .icon { font-size: 34px; }
      .card b { font-size: 18px; color: #f2d98a; }
      .card p { margin: 0; font-size: 14px; line-height: 1.6; color: #d8c8a8; }
      .tag { align-self: flex-start; font-size: 12px; padding: 1px 8px; border: 1px solid; }
      .tag.wip { color: #8ad08a; } .tag.frozen { color: #8ab4e0; }
      .links { display: flex; gap: 12px; font-size: 13px; }
      .links a { color: #f2d98a; }
      .soon { opacity: .6; border-style: dashed; }
      footer { margin-top: 40px; font-size: 12px; color: #8a7a6a; }
      footer a { color: #b8a888; }
    </style>
  </head>
  <body>
    <main>
      <h1>game-lab</h1>
      <p class="sub">혼자 만드는 브라우저 게임 실험실</p>
      <div class="grid">
        <a class="card" href="./games/sea/">
          <span class="icon">⛵</span>
          <b>이세계 수군 (가제)</b>
          <span class="tag wip">개발 중 · 전투 실험판</span>
          <p>이세계 바다에 떨어진 이순신. 엘프·드워프 선원과 판옥선을 이끌고 조선으로 돌아가는 실시간 함선 운영 로그라이크.</p>
        </a>
        <a class="card" href="./games/estate/">
          <span class="icon">🏰</span>
          <b>게으른 영주</b>
          <span class="tag frozen">얼림 · 실험판</span>
          <p>영지가 잘되면 왕도로 끌려간다. 아무도 모르게 영지를 망하게 하는 경영 게임.</p>
        </a>
        <div class="card">
          <span class="icon">⚔️</span>
          <b>학습하는 보스</b>
          <span class="tag frozen">얼림 · 실험판</span>
          <p>내 습관을 배워 역이용하는 보스와 싸우는 소울라이크.</p>
          <span class="links"><a href="./games/boss/">2D 본편</a><a href="./games/boss/3d.html">3D 시험판</a></span>
        </div>
      </div>
      <footer>코드와 문서: <a href="https://github.com/gisuk2/game-lab">github.com/gisuk2/game-lab</a></footer>
    </main>
  </body>
</html>
